name: Feature request
description: Suggest an idea or improvement for BossUp!
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Check the "Ideas for v2" section of the README first, as your idea may already be planned.

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like BossUp! to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it be good?
      description: What problem does it solve, or how would it make bosses more fun?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any other ways you've thought of to get the same result?
    validations:
      required: false
